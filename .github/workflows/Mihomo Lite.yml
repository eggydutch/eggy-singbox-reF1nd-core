name: Mihomo Lite UPX

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: write

env:
  MIHOMO_REPO: https://github.com/MetaCubeX/mihomo.git
  BUILD_TAGS: no_tailscale,no_zerotier,no_easytier,no_fake_tcp
  UPX_VERSION: "5.2.0"

jobs:
  build:
    name: Build Mihomo Lite
    runs-on: ubuntu-latest

    steps:
      # ============================================================
      # Checkout this repository
      # ============================================================
      - name: Checkout workflow repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ============================================================
      # Get latest stable Mihomo release
      #
      # IMPORTANT:
      # Use /releases/latest instead of the paginated /releases API.
      # ============================================================
      - name: Get latest Mihomo stable release
        id: mihomo
        shell: bash
        run: |
          set -euo pipefail

          VERSION="$(
            curl -fsSL \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/MetaCubeX/mihomo/releases/latest" |
              jq -r '.tag_name'
          )"

          if [ -z "${VERSION}" ] || [ "${VERSION}" = "null" ]; then
            echo "ERROR: Failed to determine latest Mihomo release."
            exit 1
          fi

          echo "Latest stable Mihomo release: ${VERSION}"

          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

      # ============================================================
      # Checkout official Mihomo source
      # ============================================================
      - name: Checkout official Mihomo source
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${{ steps.mihomo.outputs.version }}"

          echo "Cloning official Mihomo ${VERSION}..."

          git clone \
            --depth 1 \
            --branch "${VERSION}" \
            "${MIHOMO_REPO}" \
            mihomo

          cd mihomo

          echo
          echo "========================================"
          echo "Mihomo source"
          echo "========================================"

          git describe --tags --always
          git rev-parse HEAD

      # ============================================================
      # Setup Go
      # ============================================================
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true
          cache: true
          cache-dependency-path: mihomo/go.sum

      # ============================================================
      # Install UPX
      # ============================================================
      - name: Install UPX
        shell: bash
        run: |
          set -euo pipefail

          ARCHIVE="upx-${UPX_VERSION}-amd64_linux.tar.xz"

          curl -fL \
            -o "/tmp/${ARCHIVE}" \
            "https://github.com/upx/upx/releases/download/v${UPX_VERSION}/${ARCHIVE}"

          tar -xJf \
            "/tmp/${ARCHIVE}" \
            -C /tmp

          install \
            "/tmp/upx-${UPX_VERSION}-amd64_linux/upx" \
            /usr/local/bin/upx

          echo
          echo "========================================"
          echo "UPX version"
          echo "========================================"

          upx --version

      # ============================================================
      # Show build configuration
      # ============================================================
      - name: Show build configuration
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Mihomo Lite build configuration"
          echo "========================================"

          echo "Mihomo version : ${{ steps.mihomo.outputs.version }}"
          echo "Build tags     : ${BUILD_TAGS}"
          echo "UPX version    : ${UPX_VERSION}"
          echo "Targets        : linux-arm64, linux-armv7"
          echo "CGO            : disabled"
          echo
          echo "Disabled optional components:"
          echo "  - Tailscale"
          echo "  - ZeroTier"
          echo "  - EasyTier"
          echo "  - Fake-TCP"
          echo "  - gVisor"
          echo
          echo "Low-memory build tag:"
          echo "  - NOT enabled"
          echo "========================================"

          go version

      # ============================================================
      # Build Linux ARM64
      # ============================================================
      - name: Build Linux ARM64
        working-directory: mihomo
        shell: bash
        env:
          GOOS: linux
          GOARCH: arm64
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail

          OUTPUT="../mihomo-linux-arm64"

          echo "Building Mihomo ${{ steps.mihomo.outputs.version }} for Linux ARM64..."

          go build \
            -trimpath \
            -tags="${BUILD_TAGS}" \
            -ldflags="-s -w -buildid=" \
            -o "${OUTPUT}" \
            .

          chmod +x "${OUTPUT}"

      # ============================================================
      # Build Linux ARMv7
      # ============================================================
      - name: Build Linux ARMv7
        working-directory: mihomo
        shell: bash
        env:
          GOOS: linux
          GOARCH: arm
          GOARM: "7"
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail

          OUTPUT="../mihomo-linux-armv7"

          echo "Building Mihomo ${{ steps.mihomo.outputs.version }} for Linux ARMv7..."

          go build \
            -trimpath \
            -tags="${BUILD_TAGS}" \
            -ldflags="-s -w -buildid=" \
            -o "${OUTPUT}" \
            .

          chmod +x "${OUTPUT}"

      # ============================================================
      # Verify architecture
      #
      # DO NOT execute the binaries here.
      # GitHub runner = x86_64
      # Built binaries = ARM64 / ARMv7
      # ============================================================
      - name: Verify builds before UPX
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Binary architecture"
          echo "========================================"

          file mihomo-linux-arm64
          file mihomo-linux-armv7

          echo
          echo "========================================"
          echo "Binary size"
          echo "========================================"

          ls -lh \
            mihomo-linux-arm64 \
            mihomo-linux-armv7

          echo
          echo "========================================"
          echo "Expected Mihomo version"
          echo "========================================"

          echo "${{ steps.mihomo.outputs.version }}"

          echo
          echo "========================================"
          echo "Build tags"
          echo "========================================"

          echo "${BUILD_TAGS}"

          echo
          echo "ARM binaries built successfully."
          echo "Execution test is intentionally skipped because"
          echo "the GitHub runner is x86_64."

      # ============================================================
      # UPX compression
      #
      # In-place compression.
      # No .upx suffix.
      # ============================================================
      - name: Compress with UPX
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Before UPX"
          echo "========================================"

          ls -lh \
            mihomo-linux-arm64 \
            mihomo-linux-armv7

          echo
          echo "========================================"
          echo "UPX compression"
          echo "========================================"

          upx --best --lzma \
            mihomo-linux-arm64

          upx --best --lzma \
            mihomo-linux-armv7

          echo
          echo "========================================"
          echo "After UPX"
          echo "========================================"

          ls -lh \
            mihomo-linux-arm64 \
            mihomo-linux-armv7

      # ============================================================
      # Test UPX integrity
      # ============================================================
      - name: Test UPX binaries
        shell: bash
        run: |
          set -euo pipefail

          echo "Testing ARM64..."
          upx -t mihomo-linux-arm64

          echo
          echo "Testing ARMv7..."
          upx -t mihomo-linux-armv7

          echo
          echo "UPX integrity tests passed."

      # ============================================================
      # Verify compressed architecture
      # ============================================================
      - name: Verify compressed binaries
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Compressed binary architecture"
          echo "========================================"

          file mihomo-linux-arm64
          file mihomo-linux-armv7

          echo
          echo "========================================"
          echo "Compressed binary size"
          echo "========================================"

          ls -lh \
            mihomo-linux-arm64 \
            mihomo-linux-armv7

      # ============================================================
      # Generate SHA256
      # ============================================================
      - name: Generate SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail

          sha256sum \
            mihomo-linux-arm64 \
            mihomo-linux-armv7 \
            > SHA256SUMS

          echo "========================================"
          echo "SHA256"
          echo "========================================"

          cat SHA256SUMS

      # ============================================================
      # Prepare release assets
      #
      # No .upx suffix.
      # ============================================================
      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${{ steps.mihomo.outputs.version }}"

          ARM64_ASSET="mihomo-linux-arm64-${VERSION}"
          ARMV7_ASSET="mihomo-linux-armv7-${VERSION}"

          mv \
            mihomo-linux-arm64 \
            "${ARM64_ASSET}"

          mv \
            mihomo-linux-armv7 \
            "${ARMV7_ASSET}"

          echo "ARM64_ASSET=${ARM64_ASSET}" >> "${GITHUB_ENV}"
          echo "ARMV7_ASSET=${ARMV7_ASSET}" >> "${GITHUB_ENV}"

          echo
          echo "========================================"
          echo "Release assets"
          echo "========================================"

          ls -lh \
            "${ARM64_ASSET}" \
            "${ARMV7_ASSET}" \
            SHA256SUMS

      # ============================================================
      # Generate release notes
      # ============================================================
      - name: Generate release notes
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${{ steps.mihomo.outputs.version }}"

          cat > RELEASE_NOTES.md <<EOF
          # Mihomo Lite ${VERSION}

          Built from the official MetaCubeX/mihomo source.

          ## Build tags

          \`\`\`
          ${BUILD_TAGS}
          \`\`\`

          ## Disabled components

          - Tailscale
          - ZeroTier
          - EasyTier
          - Fake-TCP
          - gVisor
          - with_low_memory

          ## Targets

          - Linux ARM64
          - Linux ARMv7

          ## Build configuration

          - CGO_ENABLED=0
          - -trimpath
          - -ldflags="-s -w -buildid="
          - UPX ${UPX_VERSION}
          - UPX --best --lzma
          - No .upx filename suffix

          ## Source

          MetaCubeX/mihomo
          EOF

          cat RELEASE_NOTES.md

      # ============================================================
      # Create version-specific release
      #
      # Existing releases are NEVER deleted.
      # ============================================================
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${{ steps.mihomo.outputs.version }}"
          RELEASE_TAG="mihomo-lite-${VERSION}"
          REPO="${GITHUB_REPOSITORY}"

          echo "Repository: ${REPO}"
          echo "Release:    ${RELEASE_TAG}"

          if gh release view \
            "${RELEASE_TAG}" \
            --repo "${REPO}" \
            >/dev/null 2>&1; then

            echo "Release ${RELEASE_TAG} already exists."
            echo "Existing release will NOT be deleted."

          else

            echo "Creating release ${RELEASE_TAG}..."

            gh release create \
              "${RELEASE_TAG}" \
              --repo "${REPO}" \
              --title "Mihomo Lite ${VERSION}" \
              --notes-file RELEASE_NOTES.md

          fi

      # ============================================================
      # Upload release assets
      #
      # --clobber:
      #   Replace same-named assets in the same release.
      #
      # It does NOT delete previous releases.
      # ============================================================
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${{ steps.mihomo.outputs.version }}"
          RELEASE_TAG="mihomo-lite-${VERSION}"
          REPO="${GITHUB_REPOSITORY}"

          gh release upload \
            "${RELEASE_TAG}" \
            --repo "${REPO}" \
            "${ARM64_ASSET}" \
            "${ARMV7_ASSET}" \
            SHA256SUMS \
            --clobber

      # ============================================================
      # Final summary
      # ============================================================
      - name: Build summary
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${{ steps.mihomo.outputs.version }}"
          RELEASE_TAG="mihomo-lite-${VERSION}"

          echo "========================================"
          echo "Mihomo Lite build completed"
          echo "========================================"

          echo "Version : ${VERSION}"
          echo "Release : ${RELEASE_TAG}"

          echo
          echo "Targets:"
          echo "  - Linux ARM64"
          echo "  - Linux ARMv7"

          echo
          echo "Build tags:"
          echo "  ${BUILD_TAGS}"

          echo
          echo "UPX:"
          echo "  ${UPX_VERSION} --best --lzma"

          echo
          echo "with_low_memory:"
          echo "  DISABLED"

          echo
          echo "Old releases:"
          echo "  NOT deleted"

          echo "========================================"
