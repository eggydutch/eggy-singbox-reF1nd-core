name: Mihomo Lite UPX

on:
  workflow_dispatch:

  schedule:
    # Daily at 03:00 UTC
    # = 11:00 Singapore / Hong Kong / Beijing time
    - cron: "0 3 * * *"

permissions:
  contents: write

env:
  # ============================================================
  # Build tags
  #
  # IMPORTANT:
  # - with_gvisor is intentionally NOT included
  # ============================================================
  BUILD_TAGS: no_tailscale,no_zerotier,no_easytier,no_fake_tcp,with_low_memory

  # Official Mihomo repository
  MIHOMO_REPO: https://github.com/MetaCubeX/mihomo.git

  # UPX version
  UPX_VERSION: "5.2.0"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. Checkout YOUR repository
      #
      # Required by gh release commands.
      # ============================================================
      - name: Checkout workflow repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ============================================================
      # 2. Find latest stable Mihomo release
      # ============================================================
      - name: Get latest stable Mihomo release
        id: mihomo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Finding latest stable Mihomo release"
          echo "========================================"

          RELEASE_JSON="$(
            curl -fsSL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/MetaCubeX/mihomo/releases"
          )"

          VERSION="$(
            echo "${RELEASE_JSON}" |
            jq -r '
              map(
                select(
                  .draft == false and
                  .prerelease == false
                )
              )
              | sort_by(.published_at)
              | last
              | .tag_name
            '
          )"

          if [ -z "${VERSION}" ] || [ "${VERSION}" = "null" ]; then
            echo "ERROR: Failed to determine latest stable Mihomo version"
            exit 1
          fi

          echo "Latest stable Mihomo:"
          echo "${VERSION}"

          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

      # ============================================================
      # 3. Clone official Mihomo source
      # ============================================================
      - name: Clone official Mihomo source
        env:
          VERSION: ${{ steps.mihomo.outputs.version }}
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Cloning official MetaCubeX/mihomo"
          echo "========================================"

          echo "Repository:"
          echo "  ${MIHOMO_REPO}"

          echo
          echo "Version:"
          echo "  ${VERSION}"

          rm -rf mihomo

          git clone \
            --depth 1 \
            --branch "${VERSION}" \
            "${MIHOMO_REPO}" \
            mihomo

          cd mihomo

          echo
          echo "Remote:"
          git remote -v

          echo
          echo "Commit:"
          git rev-parse HEAD

          echo
          echo "Tag:"
          git describe --tags --always

      # ============================================================
      # 4. Setup Go
      # ============================================================
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true
          cache: true
          cache-dependency-path: mihomo/go.sum

      # ============================================================
      # 5. Install UPX
      # ============================================================
      - name: Install UPX
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Installing UPX ${UPX_VERSION}"
          echo "========================================"

          UPX_ARCHIVE="upx-${UPX_VERSION}-amd64_linux.tar.xz"
          UPX_DIR="upx-${UPX_VERSION}-amd64_linux"

          wget -q \
            "https://github.com/upx/upx/releases/download/v${UPX_VERSION}/${UPX_ARCHIVE}"

          tar -xf "${UPX_ARCHIVE}"

          sudo install \
            -m 755 \
            "${UPX_DIR}/upx" \
            /usr/local/bin/upx

          echo
          upx --version

      # ============================================================
      # 6. Show build configuration
      # ============================================================
      - name: Show build configuration
        env:
          VERSION: ${{ steps.mihomo.outputs.version }}
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Mihomo Lite Build Configuration"
          echo "========================================"

          echo
          echo "Version:"
          echo "  ${VERSION}"

          echo
          echo "Source:"
          echo "  ${MIHOMO_REPO}"

          echo
          echo "Build tags:"
          echo "  ${BUILD_TAGS}"

          echo
          echo "gVisor:"
          echo "  DISABLED"

          echo
          echo "Tailscale:"
          echo "  DISABLED"

          echo
          echo "ZeroTier:"
          echo "  DISABLED"

          echo
          echo "EasyTier:"
          echo "  DISABLED"

          echo
          echo "Fake-TCP:"
          echo "  DISABLED"

          echo
          echo "Low-memory:"
          echo "  ENABLED"

          echo
          echo "Targets:"
          echo "  linux/arm64"
          echo "  linux/arm/v7"

          echo
          echo "CGO:"
          echo "  disabled"

          echo
          echo "UPX:"
          echo "  ${UPX_VERSION}"
          echo "  --best --lzma"

      # ============================================================
      # 7. Build Linux ARM64
      # ============================================================
      - name: Build Mihomo Linux ARM64
        working-directory: mihomo
        env:
          VERSION: ${{ steps.mihomo.outputs.version }}
          GOOS: linux
          GOARCH: arm64
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail

          OUTPUT="../mihomo-linux-arm64"

          echo "========================================"
          echo "Building Linux ARM64"
          echo "========================================"

          go build \
            -trimpath \
            -tags="${BUILD_TAGS}" \
            -ldflags="-s -w -buildid=" \
            -o "${OUTPUT}" \
            .

          chmod +x "${OUTPUT}"

          echo
          echo "Binary:"
          file "${OUTPUT}"

          echo
          echo "Size:"
          ls -lh "${OUTPUT}"

      # ============================================================
      # 8. Build Linux ARMv7
      # ============================================================
      - name: Build Mihomo Linux ARMv7
        working-directory: mihomo
        env:
          VERSION: ${{ steps.mihomo.outputs.version }}
          GOOS: linux
          GOARCH: arm
          GOARM: "7"
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail

          OUTPUT="../mihomo-linux-armv7"

          echo "========================================"
          echo "Building Linux ARMv7"
          echo "========================================"

          go build \
            -trimpath \
            -tags="${BUILD_TAGS}" \
            -ldflags="-s -w -buildid=" \
            -o "${OUTPUT}" \
            .

          chmod +x "${OUTPUT}"

          echo
          echo "Binary:"
          file "${OUTPUT}"

          echo
          echo "Size:"
          ls -lh "${OUTPUT}"

      # ============================================================
      # 9. Verify architecture before UPX
      # ============================================================
      - name: Verify binaries
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Verifying binaries"
          echo "========================================"

          echo
          echo "ARM64:"
          file mihomo-linux-arm64

          echo
          echo "ARMv7:"
          file mihomo-linux-armv7

          echo
          echo "Sizes:"
          ls -lh \
            mihomo-linux-arm64 \
            mihomo-linux-armv7

          echo
          echo "Architecture checks:"

          file mihomo-linux-arm64 |
            grep -Ei "aarch64|arm64"

          file mihomo-linux-armv7 |
            grep -Ei "ARM"

      # ============================================================
      # 10. UPX compression
      #
      # IMPORTANT:
      # No ".upx" suffix.
      # UPX modifies the existing binaries in-place.
      # ============================================================
      - name: UPX compress binaries
        run: |
          set -euo pipefail

          echo "========================================"
          echo "UPX compression"
          echo "========================================"

          echo
          echo "ARM64:"
          upx \
            --best \
            --lzma \
            mihomo-linux-arm64

          echo
          echo "ARMv7:"
          upx \
            --best \
            --lzma \
            mihomo-linux-armv7

          echo
          echo "Compressed sizes:"
          ls -lh \
            mihomo-linux-arm64 \
            mihomo-linux-armv7

      # ============================================================
      # 11. UPX integrity test
      # ============================================================
      - name: Test UPX binaries
        run: |
          set -euo pipefail

          echo "========================================"
          echo "UPX integrity test"
          echo "========================================"

          upx -t mihomo-linux-arm64
          upx -t mihomo-linux-armv7

          echo
          echo "UPX test passed."

      # ============================================================
      # 12. Generate SHA256
      # ============================================================
      - name: Generate SHA256
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Generating SHA256"
          echo "========================================"

          sha256sum \
            mihomo-linux-arm64 \
            mihomo-linux-armv7 \
            > SHA256SUMS

          echo
          cat SHA256SUMS

      # ============================================================
      # 13. Rename artifacts with version
      # ============================================================
      - name: Prepare release artifacts
        env:
          VERSION: ${{ steps.mihomo.outputs.version }}
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Preparing release artifacts"
          echo "========================================"

          mv \
            mihomo-linux-arm64 \
            "mihomo-linux-arm64-${VERSION}"

          mv \
            mihomo-linux-armv7 \
            "mihomo-linux-armv7-${VERSION}"

          echo
          echo "Final artifacts:"
          ls -lh \
            "mihomo-linux-arm64-${VERSION}" \
            "mihomo-linux-armv7-${VERSION}" \
            SHA256SUMS

      # ============================================================
      # 14. Prepare release notes
      # ============================================================
      - name: Prepare release notes
        env:
          VERSION: ${{ steps.mihomo.outputs.version }}
        run: |
          set -euo pipefail

          RELEASE_TAG="mihomo-lite-${VERSION}"

          cat > RELEASE_NOTES.md <<EOF
          # Mihomo Lite ${VERSION}

          Official source:

          https://github.com/MetaCubeX/mihomo

          ## Version

          ${VERSION}

          ## Build tags

          \`${BUILD_TAGS}\`

          ## Disabled features

          - Tailscale
          - ZeroTier
          - EasyTier
          - Fake-TCP
          - gVisor

          ## Enabled features

          - Low-memory relay buffer

          ## Targets

          - Linux ARM64
          - Linux ARMv7

          Designed for OpenWrt / ImmortalWrt routers.

          ## Build options

          - CGO_ENABLED=0
          - -trimpath
          - -s -w
          - UPX ${UPX_VERSION}
          - UPX --best --lzma

          ## Assets

          - mihomo-linux-arm64-${VERSION}
          - mihomo-linux-armv7-${VERSION}
          - SHA256SUMS

          This binary was compiled directly from the official
          MetaCubeX/mihomo source code.
          EOF

          echo "========================================"
          echo "Release notes"
          echo "========================================"

          cat RELEASE_NOTES.md

      # ============================================================
      # 15. Create version-specific GitHub Release
      #
      # IMPORTANT:
      # --repo explicitly points to YOUR repository.
      # No dependency on current working directory.
      # ============================================================
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.mihomo.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          RELEASE_TAG="mihomo-lite-${VERSION}"

          echo "========================================"
          echo "GitHub Release"
          echo "========================================"

          echo
          echo "Repository:"
          echo "  ${REPO}"

          echo
          echo "Release:"
          echo "  ${RELEASE_TAG}"

          if gh release view \
            "${RELEASE_TAG}" \
            --repo "${REPO}" \
            >/dev/null 2>&1; then

            echo
            echo "Release already exists."
            echo "Old releases will NOT be deleted."

          else

            echo
            echo "Creating new release..."

            gh release create \
              "${RELEASE_TAG}" \
              --repo "${REPO}" \
              --title "Mihomo Lite ${VERSION}" \
              --notes-file RELEASE_NOTES.md

            echo
            echo "Release created successfully."

          fi

      # ============================================================
      # 16. Upload release assets
      #
      # --clobber only replaces assets with the same filename
      # in THIS release.
      #
      # It does NOT delete:
      # - old releases
      # - other version assets
      # - other releases
      # ============================================================
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.mihomo.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          RELEASE_TAG="mihomo-lite-${VERSION}"

          ARM64_ASSET="mihomo-linux-arm64-${VERSION}"
          ARMV7_ASSET="mihomo-linux-armv7-${VERSION}"

          echo "========================================"
          echo "Uploading release assets"
          echo "========================================"

          echo
          echo "Release:"
          echo "  ${RELEASE_TAG}"

          echo
          echo "Assets:"
          echo "  ${ARM64_ASSET}"
          echo "  ${ARMV7_ASSET}"
          echo "  SHA256SUMS"

          gh release upload \
            "${RELEASE_TAG}" \
            --repo "${REPO}" \
            "${ARM64_ASSET}" \
            "${ARMV7_ASSET}" \
            SHA256SUMS \
            --clobber

          echo
          echo "Assets uploaded successfully."

      # ============================================================
      # 17. Final summary
      # ============================================================
      - name: Build summary
        env:
          VERSION: ${{ steps.mihomo.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          RELEASE_TAG="mihomo-lite-${VERSION}"

          echo
          echo "========================================"
          echo "Mihomo Lite build completed"
          echo "========================================"

          echo
          echo "Repository:"
          echo "  ${REPO}"

          echo
          echo "Version:"
          echo "  ${VERSION}"

          echo
          echo "Build tags:"
          echo "  ${BUILD_TAGS}"

          echo
          echo "Targets:"
          echo "  linux/arm64"
          echo "  linux/armv7"

          echo
          echo "gVisor:"
          echo "  disabled"

          echo
          echo "UPX:"
          echo "  ${UPX_VERSION} --best --lzma"

          echo
          echo "Artifacts:"
          ls -lh \
            "mihomo-linux-arm64-${VERSION}" \
            "mihomo-linux-armv7-${VERSION}" \
            SHA256SUMS

          echo
          echo "Release:"
          echo "  ${RELEASE_TAG}"

          echo
          echo "Old releases:"
          echo "  NOT deleted"

          echo
          echo "========================================"
          echo "DONE"
          echo "========================================"
