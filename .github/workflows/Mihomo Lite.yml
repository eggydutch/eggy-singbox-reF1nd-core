name: Mihomo Lite UPX

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: write

env:
  MIHOMO_REPO: https://github.com/MetaCubeX/mihomo.git
  BUILD_TAGS: no_tailscale,no_zerotier,no_easytier,no_fake_tcp,with_low_memory
  UPX_VERSION: "5.2.0"

jobs:
  build:
    name: Build Mihomo Lite
    runs-on: ubuntu-latest

    steps:
      # ------------------------------------------------------------
      # Checkout this repository
      # Required so gh/release operations have a valid git repository.
      # ------------------------------------------------------------
      - name: Checkout workflow repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ------------------------------------------------------------
      # Get the actual latest stable Mihomo release.
      #
      # IMPORTANT:
      # Do NOT use /releases and assume the first page contains the
      # latest release. /releases/latest directly returns the latest
      # non-draft, non-prerelease GitHub release.
      # ------------------------------------------------------------
      - name: Get latest Mihomo stable release
        id: mihomo
        shell: bash
        run: |
          set -euo pipefail

          VERSION="$(
            curl -fsSL \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/MetaCubeX/mihomo/releases/latest" |
              jq -r '.tag_name'
          )"

          if [ -z "${VERSION}" ] || [ "${VERSION}" = "null" ]; then
            echo "ERROR: Failed to determine latest Mihomo release."
            exit 1
          fi

          echo "Latest stable Mihomo release: ${VERSION}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

      # ------------------------------------------------------------
      # Clone official Mihomo source at the exact stable release tag.
      # ------------------------------------------------------------
      - name: Checkout official Mihomo source
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${{ steps.mihomo.outputs.version }}"

          echo "Cloning Mihomo ${VERSION}..."
          git clone \
            --depth 1 \
            --branch "${VERSION}" \
            "${MIHOMO_REPO}" \
            mihomo

          cd mihomo

          echo "Mihomo source:"
          git describe --tags --always --dirty
          git rev-parse HEAD

      # ------------------------------------------------------------
      # Setup Go according to the current GitHub Actions environment.
      # ------------------------------------------------------------
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true
          cache: true
          cache-dependency-path: mihomo/go.sum

      # ------------------------------------------------------------
      # Install UPX
      # ------------------------------------------------------------
      - name: Install UPX
        shell: bash
        run: |
          set -euo pipefail

          UPX_VERSION="${UPX_VERSION}"
          ARCHIVE="upx-${UPX_VERSION}-amd64_linux.tar.xz"

          curl -fL \
            -o "/tmp/${ARCHIVE}" \
            "https://github.com/upx/upx/releases/download/v${UPX_VERSION}/${ARCHIVE}"

          tar -xJf "/tmp/${ARCHIVE}" -C /tmp

          install \
            "/tmp/upx-${UPX_VERSION}-amd64_linux/upx" \
            /usr/local/bin/upx

          upx --version

      # ------------------------------------------------------------
      # Show build configuration
      # ------------------------------------------------------------
      - name: Show build configuration
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Mihomo Lite build configuration"
          echo "========================================"
          echo "Mihomo version : ${{ steps.mihomo.outputs.version }}"
          echo "Build tags     : ${BUILD_TAGS}"
          echo "UPX version    : ${UPX_VERSION}"
          echo "Targets        : linux-arm64, linux-armv7"
          echo "CGO            : disabled"
          echo "========================================"

          go version

      # ------------------------------------------------------------
      # Build Linux ARM64
      # ------------------------------------------------------------
      - name: Build Linux ARM64
        working-directory: mihomo
        shell: bash
        env:
          GOOS: linux
          GOARCH: arm64
          CGO_ENABLED: "0"
          VERSION: ${{ steps.mihomo.outputs.version }}
        run: |
          set -euo pipefail

          OUTPUT="../mihomo-linux-arm64"

          echo "Building Mihomo ${VERSION} for Linux ARM64..."

          go build \
            -trimpath \
            -tags="${BUILD_TAGS}" \
            -ldflags="-s -w -buildid=" \
            -o "${OUTPUT}" \
            .

          chmod +x "${OUTPUT}"

          echo "ARM64 build completed."

      # ------------------------------------------------------------
      # Build Linux ARMv7
      # ------------------------------------------------------------
      - name: Build Linux ARMv7
        working-directory: mihomo
        shell: bash
        env:
          GOOS: linux
          GOARCH: arm
          GOARM: "7"
          CGO_ENABLED: "0"
          VERSION: ${{ steps.mihomo.outputs.version }}
        run: |
          set -euo pipefail

          OUTPUT="../mihomo-linux-armv7"

          echo "Building Mihomo ${VERSION} for Linux ARMv7..."

          go build \
            -trimpath \
            -tags="${BUILD_TAGS}" \
            -ldflags="-s -w -buildid=" \
            -o "${OUTPUT}" \
            .

          chmod +x "${OUTPUT}"

          echo "ARMv7 build completed."

      # ------------------------------------------------------------
      # Verify architecture and build information BEFORE UPX.
      # ------------------------------------------------------------
      - name: Verify builds before UPX
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Binary architecture"
          echo "========================================"

          file mihomo-linux-arm64
          file mihomo-linux-armv7

          echo
          echo "========================================"
          echo "Mihomo ARM64 version"
          echo "========================================"

          ./mihomo-linux-arm64 -v

          echo
          echo "========================================"
          echo "Mihomo ARMv7 version"
          echo "========================================"

          ./mihomo-linux-armv7 -v

          echo
          echo "========================================"
          echo "Expected version"
          echo "========================================"

          echo "${{ steps.mihomo.outputs.version }}"

      # ------------------------------------------------------------
      # Verify that the binary really contains the expected version.
      #
      # This prevents the previous 1.10.0 problem from silently
      # producing a release with the wrong Mihomo version.
      # ------------------------------------------------------------
      - name: Verify Mihomo version
        shell: bash
        run: |
          set -euo pipefail

          EXPECTED="${{ steps.mihomo.outputs.version }}"

          ARM64_VERSION="$(
            ./mihomo-linux-arm64 -v |
            awk 'NR==1 {print $3}'
          )"

          ARMV7_VERSION="$(
            ./mihomo-linux-armv7 -v |
            awk 'NR==1 {print $3}'
          )"

          echo "Expected : ${EXPECTED}"
          echo "ARM64    : ${ARM64_VERSION}"
          echo "ARMv7    : ${ARMV7_VERSION}"

          if [ "${ARM64_VERSION}" != "${EXPECTED}" ]; then
            echo "ERROR: ARM64 Mihomo version mismatch!"
            exit 1
          fi

          if [ "${ARMV7_VERSION}" != "${EXPECTED}" ]; then
            echo "ERROR: ARMv7 Mihomo version mismatch!"
            exit 1
          fi

          echo "Mihomo version verification passed."

      # ------------------------------------------------------------
      # UPX maximum compression.
      #
      # No .upx suffix is added.
      # Compression is performed in-place.
      # ------------------------------------------------------------
      - name: Compress with UPX
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Before UPX"
          echo "========================================"

          ls -lh \
            mihomo-linux-arm64 \
            mihomo-linux-armv7

          echo
          echo "========================================"
          echo "UPX compression"
          echo "========================================"

          upx --best --lzma mihomo-linux-arm64
          upx --best --lzma mihomo-linux-armv7

          echo
          echo "========================================"
          echo "After UPX"
          echo "========================================"

          ls -lh \
            mihomo-linux-arm64 \
            mihomo-linux-armv7

      # ------------------------------------------------------------
      # Test UPX integrity.
      # ------------------------------------------------------------
      - name: Test UPX binaries
        shell: bash
        run: |
          set -euo pipefail

          upx -t mihomo-linux-arm64
          upx -t mihomo-linux-armv7

      # ------------------------------------------------------------
      # Verify the compressed binaries still execute and report
      # the correct Mihomo version.
      # ------------------------------------------------------------
      - name: Verify compressed binaries
        shell: bash
        run: |
          set -euo pipefail

          EXPECTED="${{ steps.mihomo.outputs.version }}"

          echo "ARM64:"
          ./mihomo-linux-arm64 -v

          echo
          echo "ARMv7:"
          ./mihomo-linux-armv7 -v

          ARM64_VERSION="$(
            ./mihomo-linux-arm64 -v |
            awk 'NR==1 {print $3}'
          )"

          ARMV7_VERSION="$(
            ./mihomo-linux-armv7 -v |
            awk 'NR==1 {print $3}'
          )"

          if [ "${ARM64_VERSION}" != "${EXPECTED}" ]; then
            echo "ERROR: Compressed ARM64 binary version mismatch!"
            exit 1
          fi

          if [ "${ARMV7_VERSION}" != "${EXPECTED}" ]; then
            echo "ERROR: Compressed ARMv7 binary version mismatch!"
            exit 1
          fi

          echo "Compressed binaries verified successfully."

      # ------------------------------------------------------------
      # SHA256
      # ------------------------------------------------------------
      - name: Generate SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail

          sha256sum \
            mihomo-linux-arm64 \
            mihomo-linux-armv7 \
            > SHA256SUMS

          cat SHA256SUMS

      # ------------------------------------------------------------
      # Rename release assets.
      #
      # No .upx suffix.
      # ------------------------------------------------------------
      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${{ steps.mihomo.outputs.version }}"

          ARM64_ASSET="mihomo-linux-arm64-${VERSION}"
          ARMV7_ASSET="mihomo-linux-armv7-${VERSION}"

          mv \
            mihomo-linux-arm64 \
            "${ARM64_ASSET}"

          mv \
            mihomo-linux-armv7 \
            "${ARMV7_ASSET}"

          echo "ARM64_ASSET=${ARM64_ASSET}" >> "${GITHUB_ENV}"
          echo "ARMV7_ASSET=${ARMV7_ASSET}" >> "${GITHUB_ENV}"

          echo "Prepared:"
          ls -lh \
            "${ARM64_ASSET}" \
            "${ARMV7_ASSET}" \
            SHA256SUMS

      # ------------------------------------------------------------
      # Release notes
      # ------------------------------------------------------------
      - name: Generate release notes
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${{ steps.mihomo.outputs.version }}"

          cat > RELEASE_NOTES.md <<EOF
          # Mihomo Lite ${VERSION}

          Built from the official MetaCubeX/mihomo source.

          ## Build tags

          \`\`\`
          ${BUILD_TAGS}
          \`\`\`

          ### Enabled

          - with_low_memory

          ### Disabled

          - no_tailscale
          - no_zerotier
          - no_easytier
          - no_fake_tcp
          - with_gvisor not enabled

          ## Targets

          - Linux ARM64
          - Linux ARMv7

          ## Build configuration

          - CGO_ENABLED=0
          - -trimpath
          - -ldflags="-s -w -buildid="
          - UPX ${UPX_VERSION}
          - UPX --best --lzma
          - No .upx filename suffix

          ## Source

          MetaCubeX/mihomo
          EOF

          cat RELEASE_NOTES.md

      # ------------------------------------------------------------
      # Create version-specific release.
      #
      # IMPORTANT:
      # Existing releases are NEVER deleted.
      # ------------------------------------------------------------
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${{ steps.mihomo.outputs.version }}"
          RELEASE_TAG="mihomo-lite-${VERSION}"
          REPO="${GITHUB_REPOSITORY}"

          echo "Repository: ${REPO}"
          echo "Release:    ${RELEASE_TAG}"

          if gh release view \
            "${RELEASE_TAG}" \
            --repo "${REPO}" \
            >/dev/null 2>&1; then

            echo "Release ${RELEASE_TAG} already exists."
            echo "It will NOT be deleted or recreated."

          else

            echo "Creating release ${RELEASE_TAG}..."

            gh release create \
              "${RELEASE_TAG}" \
              --repo "${REPO}" \
              --title "Mihomo Lite ${VERSION}" \
              --notes-file RELEASE_NOTES.md

          fi

      # ------------------------------------------------------------
      # Upload assets.
      #
      # --clobber only replaces assets with the SAME filename inside
      # the SAME release. It does NOT delete old releases.
      # ------------------------------------------------------------
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${{ steps.mihomo.outputs.version }}"
          RELEASE_TAG="mihomo-lite-${VERSION}"
          REPO="${GITHUB_REPOSITORY}"

          gh release upload \
            "${RELEASE_TAG}" \
            --repo "${REPO}" \
            "${ARM64_ASSET}" \
            "${ARMV7_ASSET}" \
            SHA256SUMS \
            --clobber

      # ------------------------------------------------------------
      # Final summary
      # ------------------------------------------------------------
      - name: Build summary
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${{ steps.mihomo.outputs.version }}"
          RELEASE_TAG="mihomo-lite-${VERSION}"

          echo "========================================"
          echo "Mihomo Lite build completed"
          echo "========================================"
          echo "Version : ${VERSION}"
          echo "Release : ${RELEASE_TAG}"
          echo
          echo "Targets:"
          echo "  - Linux ARM64"
          echo "  - Linux ARMv7"
          echo
          echo "Tags:"
          echo "  ${BUILD_TAGS}"
          echo
          echo "UPX:"
          echo "  ${UPX_VERSION} --best --lzma"
          echo
          echo "Old releases were NOT deleted."
          echo "========================================"
