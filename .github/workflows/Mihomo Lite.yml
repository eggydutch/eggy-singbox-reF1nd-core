name: Build Mihomo Lite

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      BUILD_TAGS: "no_tailscale,no_zerotier,no_easytier,no_fake_tcp"

    steps:
      # ============================================================
      # Checkout user's repository
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ============================================================
      # Get latest Mihomo release
      # ============================================================
      - name: Get latest Mihomo release
        id: mihomo
        shell: bash
        run: |
          set -euo pipefail

          API="https://api.github.com/repos/MetaCubeX/mihomo/releases/latest"

          VERSION="$(
            curl -fsSL \
              -H "Accept: application/vnd.github+json" \
              "$API" |
            jq -r '.tag_name'
          )"

          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            echo "ERROR: Failed to obtain Mihomo version"
            exit 1
          fi

          echo "Mihomo latest release: $VERSION"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # ============================================================
      # Checkout exact Mihomo release tag
      # ============================================================
      - name: Checkout Mihomo
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${{ steps.mihomo.outputs.version }}"

          git clone \
            --depth 1 \
            --branch "$VERSION" \
            https://github.com/MetaCubeX/mihomo.git \
            mihomo

          cd mihomo

          echo "========================================"
          echo "Mihomo source information"
          echo "========================================"

          echo "Git tag:"
          git describe --tags --always

          echo
          echo "Git commit:"
          git rev-parse HEAD

          echo
          echo "Go module:"
          head -5 go.mod

      # ============================================================
      # Setup Go
      # ============================================================
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: mihomo/go.mod
          cache-dependency-path: mihomo/go.sum

      # ============================================================
      # Install UPX
      # ============================================================
      - name: Install UPX
        shell: bash
        run: |
          set -euo pipefail

          UPX_VERSION="5.2.0"

          curl -fL \
            -o /tmp/upx.tar.xz \
            "https://github.com/upx/upx/releases/download/v${UPX_VERSION}/upx-${UPX_VERSION}-amd64_linux.tar.xz"

          tar -xJf /tmp/upx.tar.xz -C /tmp

          sudo install \
            "/tmp/upx-${UPX_VERSION}-amd64_linux/upx" \
            /usr/local/bin/upx

          upx --version

      # ============================================================
      # Build Mihomo ARM64 + ARMv7
      # ============================================================
      - name: Build Mihomo
        shell: bash
        run: |
          set -euo pipefail

          cd mihomo

          VERSION="$(git describe --tags)"
          BUILDTIME="$(date -u)"

          echo "========================================"
          echo "Build configuration"
          echo "========================================"
          echo "VERSION    : $VERSION"
          echo "BUILDTIME  : $BUILDTIME"
          echo "BUILD TAGS : $BUILD_TAGS"
          echo "Go version : $(go version)"
          echo

          mkdir -p ../dist

          # ----------------------------------------------------------
          # This follows upstream Mihomo Makefile version injection:
          #
          # -X github.com/metacubex/mihomo/constant.Version
          # -X github.com/metacubex/mihomo/constant.BuildTime
          #
          # But intentionally does NOT use upstream's with_gvisor tag.
          # ----------------------------------------------------------

          LDFLAGS="-X github.com/metacubex/mihomo/constant.Version=${VERSION} \
            -X github.com/metacubex/mihomo/constant.BuildTime=${BUILDTIME} \
            -w -s -buildid="

          echo "========================================"
          echo "Building ARM64"
          echo "========================================"

          CGO_ENABLED=0 \
          GOOS=linux \
          GOARCH=arm64 \
          go build \
            -trimpath \
            -tags="${BUILD_TAGS}" \
            -ldflags="${LDFLAGS}" \
            -o ../dist/mihomo-linux-arm64 \
            .

          echo
          echo "========================================"
          echo "Building ARMv7"
          echo "========================================"

          CGO_ENABLED=0 \
          GOOS=linux \
          GOARCH=arm \
          GOARM=7 \
          go build \
            -trimpath \
            -tags="${BUILD_TAGS}" \
            -ldflags="${LDFLAGS}" \
            -o ../dist/mihomo-linux-armv7 \
            .

      # ============================================================
      # Verify binaries WITHOUT executing ARM binaries
      # ============================================================
      - name: Verify builds
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${{ steps.mihomo.outputs.version }}"

          echo "========================================"
          echo "Expected Mihomo version"
          echo "========================================"
          echo "$VERSION"

          echo
          echo "========================================"
          echo "Binary architecture"
          echo "========================================"

          file dist/mihomo-linux-arm64
          file dist/mihomo-linux-armv7

          echo
          echo "========================================"
          echo "Verify version metadata"
          echo "========================================"

          echo "--- ARM64 ---"
          strings dist/mihomo-linux-arm64 | grep -F "$VERSION" | head -5 || true

          echo "--- ARMv7 ---"
          strings dist/mihomo-linux-armv7 | grep -F "$VERSION" | head -5 || true

          # The version must actually exist inside the binary.
          if ! strings dist/mihomo-linux-arm64 | grep -Fq "$VERSION"; then
            echo "ERROR: ARM64 binary does not contain expected version: $VERSION"
            exit 1
          fi

          if ! strings dist/mihomo-linux-armv7 | grep -Fq "$VERSION"; then
            echo "ERROR: ARMv7 binary does not contain expected version: $VERSION"
            exit 1
          fi

          echo
          echo "Version injection: OK"

      # ============================================================
      # UPX compression
      # ============================================================
      - name: Compress with UPX
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "UPX compression"
          echo "========================================"

          upx \
            --best \
            --lzma \
            dist/mihomo-linux-arm64

          upx \
            --best \
            --lzma \
            dist/mihomo-linux-armv7

          echo
          echo "========================================"
          echo "UPX test"
          echo "========================================"

          upx -t dist/mihomo-linux-arm64
          upx -t dist/mihomo-linux-armv7

      # ============================================================
      # Final verification after UPX
      # ============================================================
      - name: Final verification
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${{ steps.mihomo.outputs.version }}"

          echo "========================================"
          echo "Final binaries"
          echo "========================================"

          ls -lh dist/

          echo
          file dist/mihomo-linux-arm64
          file dist/mihomo-linux-armv7

          echo
          echo "========================================"
          echo "Final version verification"
          echo "========================================"

          if ! strings dist/mihomo-linux-arm64 | grep -Fq "$VERSION"; then
            echo "ERROR: ARM64 version verification failed after UPX"
            exit 1
          fi

          if ! strings dist/mihomo-linux-armv7 | grep -Fq "$VERSION"; then
            echo "ERROR: ARMv7 version verification failed after UPX"
            exit 1
          fi

          echo "ARM64 version: $VERSION"
          echo "ARMv7 version: $VERSION"

          echo
          echo "========================================"
          echo "SHA256"
          echo "========================================"

          sha256sum dist/mihomo-linux-arm64
          sha256sum dist/mihomo-linux-armv7

      # ============================================================
      # Create / update version-specific release
      #
      # IMPORTANT:
      # - Never delete previous releases
      # - Never delete previous assets
      # - If release already exists, update it
      # - Existing same-name assets may be replaced
      # ============================================================
      - name: Create or update release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.mihomo.outputs.version }}
        run: |
          set -euo pipefail

          RELEASE_TAG="mihomo-lite-${VERSION}"

          echo "========================================"
          echo "Release"
          echo "========================================"
          echo "Tag: $RELEASE_TAG"

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists."
            echo "Updating existing release..."
          else
            echo "Release does not exist."
            echo "Creating new release..."

            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Mihomo Lite ${VERSION}" \
              --notes "Mihomo ${VERSION} Lite build.

          Source:
          https://github.com/MetaCubeX/mihomo/releases/tag/${VERSION}

          Build tags:
          ${BUILD_TAGS}

          Architectures:
          - Linux ARM64
          - Linux ARMv7

          Build:
          - CGO_ENABLED=0
          - UPX 5.2.0
          - UPX --best --lzma

          Version and build time are injected using the same
          constant.Version / constant.BuildTime mechanism used
          by the upstream Mihomo Makefile." \
              --latest=false
          fi

      # ============================================================
      # Upload assets
      # ============================================================
      - name: Upload release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.mihomo.outputs.version }}
        run: |
          set -euo pipefail

          RELEASE_TAG="mihomo-lite-${VERSION}"

          gh release upload "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber \
            dist/mihomo-linux-arm64 \
            dist/mihomo-linux-armv7

          echo
          echo "========================================"
          echo "Release uploaded"
          echo "========================================"

          gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY"
