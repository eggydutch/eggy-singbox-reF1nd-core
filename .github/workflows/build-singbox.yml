# ==============================================================
# Release
# ==============================================================

  release:

    name: Publish Release

    needs:
      - stable_version
      - testing_version
      - stable_build
      - testing_build

    runs-on: ubuntu-latest

    steps:

      # ========================================================
      # Download all artifacts
      # ========================================================

      - name: Download Stable artifacts
        uses: actions/download-artifact@v7

        with:
          pattern: stable-*
          path: release/stable
          merge-multiple: true


      - name: Download Testing artifacts
        uses: actions/download-artifact@v7

        with:
          pattern: testing-*
          path: release/testing
          merge-multiple: true


      # ========================================================
      # Verify expected files
      # ========================================================

      - name: Verify release files
        shell: bash
        run: |
          set -euo pipefail

          echo "========== Stable =========="

          find release/stable \
            -maxdepth 1 \
            -type f \
            -print

          echo
          echo "========== Testing =========="

          find release/testing \
            -maxdepth 1 \
            -type f \
            -print

          echo
          echo "========== Counts =========="

          STABLE_COUNT="$(
            find release/stable \
              -maxdepth 1 \
              -type f \
              \( -name "sing-box-linux-*" -o -name "sing-box-windows-*.exe" \) |
            wc -l
          )"

          TESTING_COUNT="$(
            find release/testing \
              -maxdepth 1 \
              -type f \
              \( -name "sing-box-linux-*" -o -name "sing-box-windows-*.exe" \) |
            wc -l
          )"

          echo "Stable : ${STABLE_COUNT}"
          echo "Testing: ${TESTING_COUNT}"

          test "${STABLE_COUNT}" -eq 4
          test "${TESTING_COUNT}" -eq 4

          echo "Artifact count: PASS"


      # ========================================================
      # SHA256
      # ========================================================

      - name: Generate SHA256
        shell: bash
        run: |
          set -euo pipefail

          cd release

          find . \
            -type f \
            \( -name "sing-box-linux-*" -o -name "sing-box-windows-*.exe" \) \
            -print0 |
          sort -z |
          xargs -0 sha256sum \
            > SHA256SUMS

          cat SHA256SUMS


      # ========================================================
      # Release notes
      # ========================================================

      - name: Generate release notes
        shell: bash
        run: |

          cat > release/RELEASE.md <<EOF

          # sing-box reF1nd

          ## Stable

          v${{ needs.stable_version.outputs.version }}

          ## Testing

          v${{ needs.testing_version.outputs.version }}

          ## Build tags

          \`${BUILD_TAGS}\`

          ## Go

          \`${GO_VERSION}\`

          ## Compression

          None. Binaries are released in their original
          uncompressed executable format.

          ## Supported protocols / features

          - VLESS Reality / Vision
          - TUIC
          - Hysteria2
          - AnyTLS
          - Clash API

          ## Linux architectures

          - ARM64 / AArch64
          - ARMv7 / 32-bit ARM
          - AMD64 / x86_64

          ## Windows architectures

          - AMD64 / x86_64

          ## OpenWrt

          Linux binaries are uncompressed.

          Users who need UPX compression can compress the
          binaries locally using their preferred UPX version.

          Files:

          - sing-box-linux-arm64
          - sing-box-linux-armv7
          - sing-box-linux-amd64

          ## Windows

          - sing-box-windows-amd64.exe

          EOF


      # ========================================================
      # Delete previous rolling release
      #
      # IMPORTANT:
      # Do NOT use:
      #
      #   gh release view sing-box
      #
      # because an orphan/missing tag can cause GitHub API 422.
      #
      # We delete the release and tag independently.
      # ========================================================

      - name: Delete previous rolling release
        shell: bash

        env:
          GH_TOKEN: ${{ github.token }}

        run: |
          set -euo pipefail

          REPO="${GITHUB_REPOSITORY}"
          TAG="sing-box"

          echo "Checking existing release: ${TAG}"

          # ----------------------------------------------------
          # 1. Find release by tag
          # ----------------------------------------------------

          RELEASE_ID="$(
            gh api \
              "repos/${REPO}/releases/tags/${TAG}" \
              --jq '.id' \
              2>/dev/null \
            || true
          )"

          if [ -n "${RELEASE_ID}" ]; then

            echo "Existing release found:"
            echo "Release ID: ${RELEASE_ID}"

            echo "Deleting release..."

            gh api \
              --method DELETE \
              "repos/${REPO}/releases/${RELEASE_ID}"

            echo "Release deleted."

          else

            echo "No existing release found."

          fi


          # ----------------------------------------------------
          # 2. Delete tag independently
          #
          # This handles the case where:
          #
          #   tag exists
          #   release does not exist
          #
          # which is exactly the kind of stale state that can
          # cause the previous gh release view/delete logic to
          # fail with HTTP 422.
          # ----------------------------------------------------

          echo
          echo "Checking existing tag: ${TAG}"

          if git ls-remote \
            --exit-code \
            --refs \
            "https://github.com/${REPO}.git" \
            "refs/tags/${TAG}" \
            >/dev/null 2>&1; then

            echo "Existing tag found."

            gh api \
              --method DELETE \
              "repos/${REPO}/git/refs/tags/${TAG}"

            echo "Tag deleted."

          else

            echo "No existing tag found."

          fi

          echo
          echo "Previous rolling release cleanup: PASS"


      # ========================================================
      # Create draft release
      # ========================================================

      - name: Create draft release
        shell: bash

        env:
          GH_TOKEN: ${{ github.token }}

        run: |
          set -euo pipefail

          gh release create sing-box \
            --repo "${GITHUB_REPOSITORY}" \
            --title "sing-box reF1nd Latest" \
            --notes-file release/RELEASE.md \
            --target "${GITHUB_SHA}" \
            --draft


      # ========================================================
      # Upload release assets
      # ========================================================

      - name: Upload release assets
        shell: bash

        env:
          GH_TOKEN: ${{ github.token }}

        run: |
          set -euo pipefail

          gh release upload sing-box \
            release/stable/sing-box-linux-arm64 \
            release/stable/sing-box-linux-armv7 \
            release/stable/sing-box-linux-amd64 \
            release/stable/sing-box-windows-amd64.exe \
            release/testing/sing-box-linux-arm64 \
            release/testing/sing-box-linux-armv7 \
            release/testing/sing-box-linux-amd64 \
            release/testing/sing-box-windows-amd64.exe \
            release/SHA256SUMS \
            --repo "${GITHUB_REPOSITORY}"


      # ========================================================
      # Publish release
      # ========================================================

      - name: Publish release
        shell: bash

        env:
          GH_TOKEN: ${{ github.token }}

        run: |
          set -euo pipefail

          gh release edit sing-box \
            --repo "${GITHUB_REPOSITORY}" \
            --draft=false
