name: Mihomo UPX Release

on:
  schedule:
    # 每日 UTC 02:00 執行
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check latest stable Mihomo release
        id: mihomo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          API="https://api.github.com/repos/MetaCubeX/mihomo/releases"

          RELEASE=$(curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "$API" |
            jq -r '
              map(select(.draft == false and .prerelease == false))
              | sort_by(.published_at)
              | last
            ')

          VERSION=$(echo "$RELEASE" | jq -r '.tag_name')

          echo "Latest stable Mihomo: $VERSION"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          echo "$RELEASE" > /tmp/release.json

      - name: Check whether release already exists
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.mihomo.outputs.version }}
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release $VERSION already exists."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Release $VERSION does not exist."
          fi

      - name: Install UPX 5.2.0
        if: steps.existing.outputs.exists == 'false'
        run: |
          set -e

          UPX_VERSION="5.2.0"

          wget -q \
            "https://github.com/upx/upx/releases/download/v${UPX_VERSION}/upx-${UPX_VERSION}-amd64_linux.tar.xz"

          tar -xf "upx-${UPX_VERSION}-amd64_linux.tar.xz"

          sudo cp \
            "upx-${UPX_VERSION}-amd64_linux/upx" \
            /usr/local/bin/upx

          sudo chmod +x /usr/local/bin/upx

          upx --version

      - name: Download latest Mihomo Linux binaries
        if: steps.existing.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.mihomo.outputs.version }}
        run: |
          set -e

          mkdir -p work release

          echo "Downloading Mihomo $VERSION"

          jq -r '
            .assets[]
            | select(
                .name
                | test("linux")
              )
            | .browser_download_url
          ' /tmp/release.json > /tmp/assets.txt

          cat /tmp/assets.txt

          while read -r URL; do
            wget -q "$URL" -P work/
          done < /tmp/assets.txt

          ls -lah work/

      - name: Extract and UPX compress
        if: steps.existing.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.mihomo.outputs.version }}
        run: |
          set -e

          cd work

          for archive in *; do
            case "$archive" in
              *.tar.gz)
                tar -xzf "$archive"
                ;;
              *.tar.xz)
                tar -xJf "$archive"
                ;;
              *.zip)
                unzip -q "$archive"
                ;;
            esac
          done

          echo "Extracted files:"
          find . -type f -maxdepth 4 -print

          cd ..

          # 找出所有 Linux Mihomo executable
          find work \
            -type f \
            -perm -111 \
            ! -name "*.gz" \
            ! -name "*.xz" \
            ! -name "*.zip" \
            -print0 |
          while IFS= read -r -d '' binary; do

            filename="$(basename "$binary")"

            # 避免把其他附帶 executable 一齊壓縮
            if file "$binary" | grep -qE 'ELF .* executable'; then

              echo "========================================"
              echo "Compressing: $binary"
              echo "========================================"

              cp "$binary" "release/${filename}.upx"

              upx \
                --best \
                --lzma \
                -o "release/${filename}.upx" \
                "$binary"

              chmod +x "release/${filename}.upx"

              echo
              echo "UPX result:"
              upx -t "release/${filename}.upx"
            fi

          done

          echo
          echo "Final release files:"
          ls -lh release/

      - name: Generate SHA256
        if: steps.existing.outputs.exists == 'false'
        run: |
          set -e

          cd release

          sha256sum *.upx > SHA256SUMS

          cat SHA256SUMS

      - name: Create GitHub Release
        if: steps.existing.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.mihomo.outputs.version }}
        run: |
          set -e

          gh release create "$VERSION" \
            release/* \
            --title "Mihomo $VERSION UPX" \
            --generate-notes

      - name: Keep only latest 2 releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          echo "Checking releases..."

          gh api \
            --paginate \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/releases?per_page=100" |
          jq -r '
            sort_by(.published_at)
            | reverse
            | .[2:]
            | .[]
            | "\(.id) \(.tag_name)"
          ' |
          while read -r ID TAG; do
            echo "Deleting old release: $TAG"

            gh api \
              --method DELETE \
              -H "Accept: application/vnd.github+json" \
              "/repos/${GITHUB_REPOSITORY}/releases/${ID}"

            # Delete corresponding tag
            gh api \
              --method DELETE \
              -H "Accept: application/vnd.github+json" \
              "/repos/${GITHUB_REPOSITORY}/git/refs/tags/${TAG}" \
              || true
          done
